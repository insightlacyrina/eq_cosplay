name: Build apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build DMG
        run: bash packaging/build_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: EQ-Cosplay-macOS
          path: dist/EQ-Cosplay-macOS.dmg

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build EXE
        shell: cmd
        run: packaging\build_windows.bat
      - uses: actions/upload-artifact@v4
        with:
          name: EQ-Cosplay-Windows
          path: dist/EQCosplay.exe
