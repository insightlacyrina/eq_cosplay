      gain: -0.0
      q: 1.1
  peq_10:
    type: Biquad
    parameters:
      type: Highshelf
      freq: 9000.0
      gain: -0.0
      q: 0.7

pipeline:
  - type: Filter
    channels: [0, 1]
    names:
      - preamp_gain
      - peq_01
      - peq_02
      - peq_03
      - peq_04
      - peq_05
      - peq_06
      - peq_07
