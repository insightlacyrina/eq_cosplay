    type: Gain
    parameters:
      gain: -10.0
      inverted: false

  peq_01:
    type: Biquad
    parameters:
      type: Lowshelf
      freq: 60.0
      gain: 0.0
      q: 0.7
  peq_02:
    type: Biquad
    parameters:
      type: Peaking
      freq: 80.5
      gain: -0.0
      q: 1.1
  peq_03:
    type: Biquad
    parameters:
      type: Peaking
      freq: 109.8
      gain: -0.0
      q: 1.1
  peq_04:
    type: Biquad
    parameters:
      type: Peaking
      freq: 323.9
      gain: -0.0
      q: 1.1
  peq_05:
    type: Biquad
    parameters:
      type: Peaking
      freq: 442.0
      gain: -0.0
      q: 1.1
  peq_06:
    type: Biquad
    parameters:
      type: Peaking
      freq: 603.2
      gain: -0.0
      q: 1.1
  peq_07:
    type: Biquad
    parameters:
      type: Peaking
      freq: 823.2
